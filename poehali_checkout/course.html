function visualScene(kind){switch(kind){case 'telegram':return `<div class="visual-phone"><div class="mini-chat-title">✳&nbsp; BotFather</div><div class="mini-msg purple">/newbot</div><div class="mini-msg">Alright, a new bot. How are we going to call it?</div><div class="mini-msg purple">Карта выбора</div><div class="mini-msg">Good. Now let's choose a username.</div><span class="mini-button">Продолжить →</span></div>`;case 'render':return `<div class="sample-browser"><div class="browser-bar"><i></i><i></i><i></i></div><div class="browser-page"><strong>⚙ Environment</strong><div class="browser-row"><span>BOT_TOKEN</span> ••••••••••••</div><div class="browser-row"><span>WEBHOOK</span> /telegram/webhook</div><div class="browser-row"><span>WEB_URL</span> https://...</div><div class="browser-cta">Save, deploy →</div></div></div>`;case 'visual':return `<div class="sample-cards"><div class="sample-art"></div><div class="sample-art"></div><div class="sample-art"></div><div class="sample-art"></div></div>`;case 'payment':return `<div class="visual-flow"><div class="flow-line">Человек открыл страницу</div><div class="flow-arrow">↓</div><div class="flow-line">Оплатил → сервер проверил</div><div class="flow-arrow">↓</div><div class="flow-line">✓ Доступ открыт</div></div>`;case 'video':return `<div class="visual-flow"><div class="flow-line">✦ Идея → текст</div><div class="flow-arrow">↓</div><div class="flow-line">▶ Вертикальное видео MP4</div><div class="flow-arrow">↓</div><div class="flow-line">✓ Проверка → публикация</div></div>`;case 'growth':return `<div class="sample-graph"><small>Как меняется путь покупателя</small><div class="bars"><span style="height:84%"></span><span style="height:64%"></span><span style="height:43%"></span><span style="height:24%"></span></div></div>`;default:return `<div class="visual-flow"><div class="flow-line">Боль человека</div><div class="flow-arrow">↓</div><div class="flow-line">Бесплатный маленький результат</div><div class="flow-arrow">↓</div> const visualText={idea:['Так будет устроен продукт','Один понятный путь от бесплатной пользы до полноценной версии.'],telegram:['Первая переписка с BotFather','Эти сообщения мы вместе увидим на экране Telegram.'],render:['Вот где живут секреты','Настоящий токен вставляем в Render, а не в открытый код.'],visual:['Одна визуальная история','Несколько картинок, одна палитра и одна атмосфера.'],payment:['Оплата — это цепочка проверок','Каждый шаг должен подтвердиться на сервере.'],video:['Автоматизация по порядку','Сначала готовый ролик, потом проверка и только затем публикация.'],growth:['От просмотров к покупкам','Смотрим, где люди уходят, и улучшаем один шаг.']};
function lessonPage(){const l=LESSONS[state.lesson],m=modOf(l),v=visualText[l.visual]||visualText.idea;const [p1,p2,p3]=l.voice;return `<div class="lesson-wrap view-enter"><div class="lesson-topline"><span><button class="crumb-click" data-nav="home">Главная</button>&nbsp; / &nbsp;${esc(m.short)}&nbsp; / &nbsp;Урок ${l.id+1}</span><span>≈ ${l.duration} минут · ${l.prompts.length} ${l.prompts.length===1?'промпт':'промпта'}</span></div><div class="lesson-cols"><article class="lesson-main"><div class="eyebrow">НАША ПРАКТИКА &nbsp; / &nbsp; ${String(l.id+1).padStart(2,'0')} ИЗ ${LESSONS.length}</div><h1 class="lesson-title">${esc(l.title)}</h1><p class="lesson-description">${esc(l.outcome)}</p><div class="clicktrail"><span>Наш маршрут:</span>${l.trail.map((t,i)=>`<b>${esc(t)}</b>${i<l.trail.length-1?`<i>${icon('chevron',12)}</i>`:''}`).join('')}</div><div class="intro-card"><div class="speaker"><div class="speaker-face">Я.</div><div><strong>Объясняю по-человечески</strong><small>Читай как разговор, не как инструкцию к космическому кораблю</small></div></div><p>${fmt(p1)}</p><p>${fmt(p2)}</p><p>${fmt(p3)}</p></div>
<div class="example-note"><div class="example-note-star">✦</div><div><strong>Показываю на нашем примере</strong><p>${esc(l.demoExample)}</p></div></div><div class="lesson-extras">${(l.examples||[]).map(e=>`<div class="course-example"><strong>${esc(e.title)}</strong><pre>${esc(e.text)}</pre></div>`).join('')}</div><div class="section-label"><span class="index-round">01</span><h2>Теперь делаем вместе</h2><small>Не спеши дальше</small></div><div class="steps">${l.steps.map((step,i)=>`<div class="step-card reveal" style="transition-delay:${i*40}ms"><div class="step-circle">${i+1}</div><div class="step-box"><div class="coach"><span></span>${esc(step.coach)}</div><h3>${esc(step.title)}</h3><p>${fmt(step.body)}</p>${step.actions?.length?`<div class="step-actions">${step.actions.map(x=>esc(String(x))).join(' · ')}</div>`:''}</div></div>`).join('')}</div>
<div class="section-label"><span class="index-round">02</span><h2>Вот что напиши ChatGPT</h2><small>Копируй и вставляй</small></div><div class="prompts-stack">${l.prompts.map((pr,i)=>`<div class="prompt-card"><div class="prompt-header"><div class="prompt-symbol">✳</div><div class="prompt-header-title"><strong>${esc(pr.title)}</strong><small>ГОТОВЫЙ ЗАПРОС · ${i+1} / ${l.prompts.length}</small></div><button class="copy-button" data-copy="${l.id}:${i}">${icon('copy',14)} Скопировать</button></div><div class="prompt-content">${esc(pr.text)}</div><div class="prompt-footer">${icon('bolt',13)}&nbsp; <b>Мой совет:</b> замени слова в квадратных скобках на свои. Ничего сложнее.</div></div>`).join('')}</div>
<div class="section-label"><span class="index-round">03</span><h2>Что должно получиться</h2></div><div class="finish-card"><div class="finish-ico">${icon('check',22)}</div><div><strong>Вот результат, который нам сейчас нужен</strong><p>${esc(l.finish)}</p></div></div><div class="pitfall"><div class="pitfall-mark">!</div><div><strong>И вот здесь не ошибись</strong><p>${esc(l.pitfall)}</p></div></div><div class="course-audit"><h3>Проверь себя перед следующим уроком</h3><ul>${(l.checks||[]).map(t=>`<li>${esc(t)}</li>`).join('')}</ul><h3>Если не получилось</h3><ul>${(l.errors||[]).map(t=>`<li>${esc(t)}</li>`).join('')}</ul>${l.links?.length?`<p>Документы и помощь: ${l.links.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(new URL(u).host)}</a>`).join(' · ')}</p>`:''}</div>
<div class="lesson-controls"><button class="mark-done ${state.done.includes(l.id)?'checked':''}" data-done="${l.id}">${icon('check',16)}${state.done.includes(l.id)?'Урок пройден ✓':'Отметить: я сделал это'}</button>${l.id<LESSONS.length-1?`<button class="next-button" data-lesson="${l.id+1}">Дальше, к уроку ${l.id+2} ${icon('arrow',16)}</button>`:`<button class="next-button" data-nav="home">Вернуться к маршруту ${icon('arrow',16)}</button>`}</div></article>
<aside class="visual-column"><div class="sticky-visual"><div class="visual-kicker">ПОКАЗЫВАЮ НА ПРИМЕРЕ</div><h3>${v[0]}</h3><p class="visual-sub">${v[1]}</p><div class="visual-display">${visualScene(l.visual)}</div></div><div class="visual-note"><strong>Маленькая подсказка от меня</strong>Не надо учить весь урок наизусть. Открывай ChatGPT рядом и повторяй действия по очереди. Всё важное можно скопировать из плашки.<button class="mini-link" data-nav="workbook">✎ Записать свою идею в тетрадь →</button></div></aside></div></div>`}
function promptPage(){const all=LESSONS.flatMap(l=>l.prompts.map((pr,i)=>({pr,i,l})));const show=state.filter==='all'?all:all.filter(x=>x.l.module===state.filter);return `<div class="view-enter"><div class="page-hero"><div class="eyebrow">НАСТОЯЩИЕ ГОТОВЫЕ ЗАПРОСЫ</div><h1>Копируй. Вставляй.<br><span class="serif">Собирай.</span></h1><p>Я собрал здесь все ${all.length} запросов, с которыми мы строим продукт. Не нужно сочинять вопросы для ИИ с нуля. Открой нужный этап, подставь свои данные и нажми одну кнопку.</p></div><div class="library-controls"><button class="filter-chip ${state.filter==='all'?'selected':''}" data-filter="all">Все ${all.length}</button>${MODS.map(m=>`<button class="filter-chip ${state.filter===m.id?'selected':''}" data-filter="${m.id}">${esc(m.short)}</button>`).join('')}</div><div class="library-grid">${show.map(x=>`<div class="library-tile reveal"><div class="library-module">${esc(modOf(x.l).short)} · УРОК ${x.l.id+1}</div><h3>${esc(x.pr.title)}</h3><p>${esc(x.pr.text.slice(0,215))}${x.pr.text.length>215?'…':''}</p><button class="tile-copy" data-copy="${x.l.id}:${x.i}">${icon('copy',15)} Скопировать промпт</button></div>`).join('')}</div></div>`}
function workbook(){return `<div class="view-enter"><div class="page-hero"><div class="eyebrow">ПУСТЬ ТВОЙ ПРОЕКТ НЕ ТЕРЯЕТСЯ</div><h1>Твоя маленькая<br><span class="serif">мастерская идей.</span></h1><p>Я специально оставил тебе место для своих решений. Не надо держать всё в голове. Заполняй по мере прохождения уроков — а когда будешь общаться с Codex, просто скачай своё ТЗ и передай его вместе с задачей.</p></div><div class="workbook-grid"><div class="workbook-card"><h2>Мой проект</h2><p>Сохраняю ответы на этом устройстве. Заполни хотя бы первые три поля, а остальное добавим по ходу.</p>${fields.map(([key,title,hint])=>`<label class="field"><span>${title} <small>(можно поправить позже)</small></span><textarea data-field="${key}" rows="2" placeholder="${esc(hint)}">${esc(state.form[key]||'')}</textarea></label>`).join('')}<div class="workbook-actions"><button class="primary-btn" data-export>${icon('download',17)} Скачать моё ТЗ</button><button class="secondary-btn" data-copy-workbook>${icon('copy',17)} Скопировать всё</button></div></div><div class="workbook-guide"><h2>Как с этим работать</h2><p>Я не прошу заполнять анкету ради анкеты. Из этих ответов потом родится задача для ChatGPT, описание проекта и карта платных функций.</p><div class="guide-line"><b>1</b><div>Выбери <strong>одну</strong> идею. Не пытайся запустить сразу пять.</div></div><div class="guide-line"><b>2</b><div>Запиши, кому и зачем бот нужен. Желательно обычными человеческими словами.</div></div><div class="guide-line"><b>3</b><div>Опиши бесплатный результат, который человек получит ещё до покупки.</div></div><div class="guide-line"><b>4</b><div>После каждого технического урока добавляй, что ты уже сделал и что осталось.</div></div><div class="guide-line"><b>5</b><div>Экспортируй ТЗ перед большой задачей для Codex или при переносе проекта в новый чат.</div></div><div class="pitfall"><div class="pitfall-mark">!</div><div><strong>Не клади сюда секреты</strong><p>Никаких токенов, паролей, банковских ключей и реальных персональных данных покупателей.</p></div></div></div></div></div>`}
function resources(){return `<div class="view-enter"><div class="page-hero"><div class="eyebrow">НЕ ПУСТЫЕ ОБЕЩАНИЯ — РАБОЧИЕ ИНСТРУМЕНТЫ</div><h1>Материалы, которые<br><span class="serif">можно применить сегодня.</span></h1><p>Здесь лежат 10 подробных схем продуктов, готовый контент-план и официальные инструкции. Все промпты копируются из уроков.</p></div><div class="section-line"><div><h2>10 моделей Telegram-продуктов</h2></div></div><div class="resource-grid">${LESSONS.filter(l=>l.module==="M01"&&/^[0-9]+[.]/.test(l.title)).map(l=>`<div class="resource-card reveal"><span>ГОТОВАЯ МОДЕЛЬ</span><h3>${esc(l.title)}</h3><p>${esc(l.goal)}</p><button class="tile-copy" data-lesson="${l.id}">Открыть подробную схему ↗</button></div>`).join('')}</div><section class="month-plan"><h2>Календарь на 30 дней</h2><p>Пример для бота «Меню на неделю». Скачай таблицу и замени темы на свою нишу — останутся структура, даты, рубрики и статусы.</p><button data-plan-download>↓ Скачать таблицу на месяц (TSV)</button><div class="table-scroll"><table><thead><tr><th>День</th><th>Рубрика</th><th>Тема</th><th>Статус</th></tr></thead><tbody>${COURSE.plan.map(r=>`<tr><td>${esc(r.day)}</td><td>${esc(r.rubric)}</td><td>${esc(r.topic)}</td><td>${esc(r.status)}</td></tr>`).join('')}</tbody></table></div></section><section class="month-plan"><h2>Официальные инструкции</h2><p>Ссылки на актуальные источники: создание канала, YouTube API, Meta API, Render и правила Telegram.</p><div class="resource-grid">${COURSE.refs.map(r=>`<div class="resource-card"><span>СПРАВКА</span><h3>${esc(r[0])}</h3><a href="${esc(r[1])}" target="_blank" rel="noopener noreferrer">Открыть официальную страницу ↗</a></div>`).join('')}</div></section></div>`}
function root(){return `<div class="site-shell">${sidebar()}<div class="mobile-shade ${state.drawer?'open':''}" data-close-drawer></div><div class="main">${topbar()}<main class="content">${state.page==='home'?home():state.page==='lesson'?lessonPage():state.page==='prompts'?promptPage():state.page==='workbook'?workbook():resources()}</main></div><footer class="app-footer"><span>ПОЕХАЛИ. · Практический курс · Версия для личного изучения</span><span>Сделано с заботой о новичках · <b>Никаких волшебных кнопок — только понятные шаги</b></span></footer><div class="dialog-overlay" id="search-overlay"><div class="search-dialog"><div class="dialog-search">${icon('search',18)}<input type="search" id="dialog-input" placeholder="Например: токен, Render, картинки, оплата..." autofocus><button data-search-close>ESC</button></div><div class="dialog-results" id="search-results"></div></div></div><div id="toast-container"></div></div>`}
function render(autoscroll=true){$('#app').innerHTML=root();bind();if(autoscroll)window.scrollTo({top:0,behavior:'instant'});const ob=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');ob.unobserve(e.target)}}),{threshold:.06});$$('.reveal').forEach(el=>ob.observe(el));}
function route(page,lesson){state.page=page;state.drawer=false;if(typeof lesson==='number')state.lesson=lesson;history.replaceState(null,'','#'+(page==='lesson'?'lesson/'+state.lesson:page));render();}
function notify(msg){let el=$('#toast-container');if(!el)return;el.innerHTML=`<div class="toast">${icon('check',17)}${esc(msg)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{const t=$('#toast-container');if(t)t.innerHTML=''},2700)}
async function copy(text){try{await navigator.clipboard.writeText(text);notify('Готово! Теперь вставь это в ChatGPT.')}catch(e){const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0;left:-9999px';document.body.appendChild(ta);ta.select();try{if(document.execCommand('copy'))notify('Скопировано! Вставь в ChatGPT.');else throw new Error('no copy')}catch(er){notify('Не удалось скопировать. Выдели текст вручную.')}ta.remove()}}
function workbookText(){return ['МОЁ ТЗ ДЛЯ ТЕЛЕГРАМ-БОТА','Дата: '+new Date().toLocaleDateString('ru-RU'),'','Собрано в курсе «Поехали»','',...fields.map(([k,t])=>t+'\n'+(state.form[k]||'[Пока не заполнено]')+'\n')].join('\n')}
function handleHash(){const h=location.hash.replace(/^#/,'');if(/^lesson\/\d+$/.test(h)){const id=+h.split('/')[1];if(id>=0&&id<LESSONS.length){state.page='lesson';state.lesson=id;return}}if(['home','prompts','workbook','resources'].includes(h))state.page=h}
function openSearch(){const layer=$('#search-overlay');layer.classList.add('show');const inp=$('#dialog-input');inp.focus();showSearch('')}
function closeSearch(){const layer=$('#search-overlay');if(layer)layer.classList.remove('show')}
function showSearch(query){let q=query.trim().toLowerCase();let found=LESSONS.filter(l=>(l.title+' '+l.context+' '+l.voice.join(' ')+' '+l.steps.map(s=>s.title+' '+s.body).join(' ')).toLowerCase().includes(q)).slice(0,10);$('#search-results').innerHTML=found.length?found.map(l=>`<button class="result-row" data-lesson="${l.id}"><b>${esc(l.title)}</b><small>${esc(modOf(l).short)} · Урок ${l.id+1}</small></button>`).join(''):'<div class="empty-note">Ничего не нашлось. Попробуй другое слово.</div>'}
function bind(){$$('[data-field]').forEach(el=>el.addEventListener('input',e=>{state.form[e.target.dataset.field]=e.target.value;save('form',state.form)}));const inp=$('#dialog-input');inp?.addEventListener('input',e=>showSearch(e.target.value));}
async function handleClick(e){const target=e.target.closest('button, a, [data-close-drawer]');if(!target)return;const d=target.dataset;if(d.planDownload!==undefined){const fields=["day","rubric","topic","hook","cta","status","publish_time","video_file"];const rows=[fields.join("\t"),...COURSE.plan.map(r=>fields.map(k=>String(r[k]??"").replaceAll("\t"," ").replaceAll("\n"," ")).join("\t"))];const blob=new Blob(["\uFEFF"+rows.join("\n")],{type:"text/tab-separated-values;charset=utf-8"});const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="poehali_content_plan_30_days.tsv";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);return}if(d.nav){route(d.nav);return}if(d.lesson!==undefined){closeSearch();route('lesson',+d.lesson);return}if(d.copy!==undefined){let [id,i]=d.copy.split(':').map(Number);const p=LESSONS[id]?.prompts[i];if(p)await copy(p.text);return}if(d.done!==undefined){const id=+d.done;state.done=state.done.includes(id)?state.done.filter(n=>n!==id):[...state.done,id];save('done_course_v3',state.done);render(false);notify(state.done.includes(id)?'Есть! Этот урок ты уже прошёл.':'Отметку снял — можно вернуться позже.');return}if(d.filter){state.filter=d.filter;render(false);return}if(d.openDrawer!==undefined){state.drawer=true;render(false);return}if(d.closeDrawer!==undefined){state.drawer=false;render(false);return}if(target.id==='search-open'){openSearch();return}if(d.searchClose!==undefined){closeSearch();return}if(d.copyWorkbook!==undefined){await copy(workbookText());return}if(d.export!==undefined){const blob=new Blob([workbookText()],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='MOY_TELEGRAM_BOT_TZ.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);notify('Твоё ТЗ скачано. Теперь его можно передать ChatGPT.');return}}
document.addEventListener('click',handleClick);
window.addEventListener('hashchange',()=>{handleHash();render()});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}if(e.key==='Escape')closeSearch()});
document.addEventListener('click',e=>{if(e.target.id==='search-overlay')closeSearch()});
handleHash();render(false);
</script></body></html>
