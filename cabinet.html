<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMART TRADER AI — SIR DEMO</title><style>
:root{color-scheme:dark;font:15px system-ui,sans-serif;background:#0b1018;color:#e8eef6}*{box-sizing:border-box}main{max-width:1000px;padding:26px;margin:auto}h1{font-size:24px}h2{font-size:17px}small,p{color:#9aa9bb}section{padding:18px;background:#121c28;border:1px solid #263447;border-radius:12px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.tile{padding:14px;border:1px solid #263447;border-radius:8px}.val{font-size:24px;font-weight:650;margin-top:8px}.good{color:#46d5a2}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;padding:10px 6px;border-bottom:1px solid #263447}th{color:#9aa9bb}.scroll{overflow:auto}</style></head><body><main><h1>SMART TRADER AI</h1><p id="status">Подключение…</p><section><h2>Торговое ядро · SIR DEMO</h2><p>Только Bybit Demo. Short — основная модель; Long — эксперимент. Старые исследования отключены.</p><div class="grid" id="base"></div></section><section><h2>Bybit Demo</h2><div class="grid" id="demo"></div><p id="audit"></p></section><section><h2>Стратегии</h2><div class="grid" id="sir"></div><p id="leaders"></p><p id="sirpositions"></p><p id="sirstats"></p></section><section><h2>Архив последних сделок</h2><div class="scroll"><table><thead><tr><th>Время</th><th>Актив</th><th>Рынок</th><th>Сторона</th><th>PnL, USDT</th></tr></thead><tbody id="trades"></tbody></table></div></section><small id="updated"></small></main><script>
const el=id=>document.getElementById(id),fmt=v=>v==null?'—':Number(v).toLocaleString('ru-RU',{maximumFractionDigits:4}),esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tile(k,v){return '<div class="tile"><small>'+esc(k)+'</small><div class="val">'+esc(v)+'</div></div>'}
async function refresh(){try{let r=await fetch('/api/cabinet',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let x=await r.json(),d=x.demo||{},s=x.state||{},a=x.demo_detail||{};el('status').textContent=s.version+' · '+(s.status==='demo'?'Demo':'Запуск')+' · '+(d.status==='connected'?'Bybit подключён':d.status||'—');el('base').innerHTML=[tile('Стратегии',s.strategies?.length??0),tile('Исследования',s.research_workers),tile('Новые ордера','DEMO'),tile('База данных',s.status==='demo'?'Сохранена':'Запуск')].join('');el('demo').innerHTML=[tile('Кошелёк USDT',fmt(d.wallet_usdt)),tile('Позиции фьючерсов',fmt(d.exchange_positions)),tile('Спот бота',fmt(d.spot_open)),tile('Лимит будущих стратегий',fmt(d.capital_limit))].join('');let q=x.sir||{};el('sir').innerHTML=[tile('Состояние',q.status),tile('Тренд',q.regime),tile('Капитал модели',fmt(q.equity)),tile('Риск %',fmt(q.risk==null?null:q.risk*100)),tile('Проверено тикеров',q.universe)].join('');el('leaders').textContent='Short: '+(q.short_leaders||[]).join(', ')+' · Long: '+(q.long_leaders||[]).join(', ');el('sirpositions').textContent='Позиции: '+(q.positions||[]).map(p=>p.symbol+' '+p.side+' '+p.phase).join(', ');el('sirstats').textContent='Short: '+fmt(q.stats?.Sell?.net)+' USDT / '+fmt(q.stats?.Sell?.n)+' сделок · Long: '+fmt(q.stats?.Buy?.net)+' USDT / '+fmt(q.stats?.Buy?.n)+' сделок';let o=d.open_orders;el('audit').textContent=o?'Открытые ордера на бирже: фьючерсы '+fmt(o.linear)+' · спот '+fmt(o.spot):'Аудит ордеров ещё не подтверждён';el('trades').innerHTML=(a.trades||[]).slice(-30).reverse().map(t=>'<tr><td>'+esc(t.closed?new Date(t.closed*1000).toLocaleString():'—')+'</td><td>'+esc(t.symbol)+'</td><td>'+esc(t.market)+'</td><td>'+esc(t.side)+'</td><td>'+esc(fmt(t.pnl))+'</td></tr>').join('');el('updated').textContent='Обновление: '+new Date(x.server_time*1000).toLocaleString()}catch(e){el('status').textContent='Нет связи: '+e.message}}
refresh();setInterval(refresh,15000);
</script></body></html>
