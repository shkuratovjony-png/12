<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMART TRADER AI · Терминал</title>
<style>
:root{color-scheme:dark;--bg:#0b1018;--panel:#121c28;--line:#263447;--text:#e8eef6;--muted:#8e9db1;--green:#46d5a2;--red:#fa8392;--blue:#83aaff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}main{max-width:1300px;margin:auto;padding:24px}header,.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:23px;margin:0;letter-spacing:.03em}h2{font-size:18px;margin:0 0 14px}h3{font-size:14px;margin:0 0 12px}small,.muted{color:var(--muted)}nav{display:flex;gap:6px;margin:25px 0 20px;overflow:auto;border-bottom:1px solid var(--line)}button,select,a.button{font:inherit;color:var(--muted);background:none;border:0;cursor:pointer;padding:11px 16px;white-space:nowrap;text-decoration:none}button.active{color:var(--text);border-bottom:2px solid var(--green);font-weight:650}select{border:1px solid var(--line);border-radius:8px;color:var(--text);padding:7px 10px;background:var(--panel)}.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.tile,section{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:17px}.tile b{display:block;font-size:clamp(20px,2.7vw,31px);font-variant-numeric:tabular-nums;margin:8px 0 3px;overflow-wrap:anywhere}.tile small{font-size:12px}.split{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px}section{margin-bottom:14px}.split section{margin:0}.up{color:var(--green)}.down{color:var(--red)}.status{display:inline-flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}.dot.bad{background:var(--red)}.dot.wait{background:#e1b96b}.chart{width:100%;height:auto;display:block;min-height:170px}.bars{display:grid;gap:14px}.track{height:7px;background:#263447;border-radius:6px;overflow:hidden;margin-top:6px}.track i{display:block;height:100%;background:var(--blue);border-radius:6px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap;text-align:left;font-variant-numeric:tabular-nums}th,td{padding:12px 9px;border-bottom:1px solid var(--line)}th{font-weight:500;color:var(--muted);font-size:12px}td{font-size:13px}tr:last-child td{border-bottom:0}.empty{text-align:center;padding:23px;color:var(--muted)}.label{color:var(--muted);font-size:12px;margin:0 0 7px}.callout{padding:10px 13px;border-left:2px solid var(--line);margin:0 0 15px;color:var(--muted);font-size:12px}.badge{background:#202e41;border-radius:5px;padding:3px 7px;font-size:11px;color:var(--muted)}.hide{display:none!important}.progress{height:10px;background:#263447;border-radius:6px;overflow:hidden}.progress i{display:block;height:100%;background:var(--green)}footer{font-size:12px;color:var(--muted);padding:12px 0 24px}.wide{grid-column:span 2}@media(max-width:760px){main{padding:13px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tile,section{padding:12px}.split{grid-template-columns:1fr}.tile b{font-size:22px}nav button,nav a.button{padding:10px 12px}.chart{min-height:145px}h1{font-size:19px}}
</style></head><body><main><header><div><h1>SMART TRADER AI</h1><small>Торговый терминал · только деморежим</small></div><div><div class="status"><span id="dot" class="dot wait"></span><span id="status">Подключение</span></div><div id="stamp" class="label"></div></div></header>

<footer>Счета разделены. Bybit Demo — исполнение на демобирже; внутренний портфель — симуляция. Экспериментальные счета не суммируются. Сутки UTC.</footer></main>
<script>
const $=id=>document.getElementById(id);let state=null,tab=location.hash.slice(1)||'overview',period=1;
const esc=x=>String(x??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=x=>x!==null&&x!==undefined&&x!==''&&Number.isFinite(Number(x));
const f=(x,d=2)=>num(x)?Number(x).toLocaleString('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
const sign=x=>num(x)?(Number(x)>0?'+':'')+f(x):'—',cl=x=>num(x)?x>0?'up':x<0?'down':'':'',usd=x=>num(x)?f(x)+' USDT':'—',pc=x=>num(x)?sign(x*100)+'%':'—';
const time=x=>num(x)?new Date(x*1000).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const day=x=>num(x)?new Date(x*1000).toISOString().slice(0,10):'';
const tile=(name,value,sub='',color='')=>'<div class="tile"><small>'+esc(name)+'</small><b class="'+color+'">'+esc(value)+'</b><small>'+esc(sub)+'</small></div>';
const tiles=items=>'<div class="tiles">'+items.join('')+'</div>';
const section=(title,body)=>'<section><h2>'+esc(title)+'</h2>'+body+'</section>';
const table=(heads,rows,empty='Нет данных')=>'<div class="scroll"><table><thead><tr>'+heads.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+(rows.length?rows.map(r=>'<tr>'+r.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+heads.length+'" class="empty">'+esc(empty)+'</td></tr>')+'</tbody></table></div>';
const colored=x=>'<span class="'+cl(x)+'">'+esc(sign(x))+'</span>';
const market=x=>x==='spot'?'Спот':'Фьючерсы';
const side=x=>x===1||x==='Buy'?'LONG':x===-1||x==='Sell'?'SHORT':'—';
function chart(points,bar=false,base=null){
 let pts=points.filter(p=>num(p.y)&&num(p.t)).sort((a,b)=>a.t-b.t);
 if(!pts.length)return '<div class="empty">Пока нет сохранённых наблюдений</div>';
 let vals=pts.map(p=>Number(p.y));if(base!==null)vals.push(base);let lo=Math.min(...vals),hi=Math.max(...vals);
 const spread=Math.max(hi-lo,.02);lo-=spread*.12;hi+=spread*.12;
 const W=720,H=255,L=70,R=18,T=12,B=34,x=i=>L+(W-L-R)*(pts.length===1?.5:i/(pts.length-1)),y=v=>T+(H-T-B)*(hi-v)/(hi-lo);
 let h='';for(let i=0;i<5;i++){let v=lo+(hi-lo)*i/4;h+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#263447"/><text x="'+(L-7)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="11" fill="#8e9db1">'+esc(f(v))+'</text>'}
 if(base!==null)h+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(base)+'" y2="'+y(base)+'" stroke="#8194af" stroke-dasharray="4 5"/>';
 if(bar){let bw=Math.min(40,(W-L-R)/Math.max(pts.length,1)*.6);pts.forEach((p,i)=>{h+='<rect x="'+(x(i)-bw/2)+'" y="'+Math.min(y(p.y),y(0))+'" width="'+bw+'" height="'+Math.max(1,Math.abs(y(p.y)-y(0)))+'" rx="3" fill="'+(p.y>=0?'#46d5a2':'#fa8392')+'"><title>'+esc(time(p.t)+' · '+sign(p.y))+'</title></rect>'})}
 else{let path=pts.map((p,i)=>x(i)+','+y(p.y)).join(' ');if(pts.length>1)h+='<polygon points="'+x(0)+','+y(lo)+' '+path+' '+x(pts.length-1)+','+y(lo)+'" fill="#46d5a2" opacity=".08"/><polyline points="'+path+'" fill="none" stroke="#46d5a2" stroke-width="2.4" stroke-linejoin="round"/>';pts.forEach((p,i)=>{if(pts.length<150||i===pts.length-1)h+='<circle cx="'+x(i)+'" cy="'+y(p.y)+'" r="'+(pts.length<30?3:1.5)+'" fill="#46d5a2"><title>'+esc(time(p.t)+' · '+f(p.y))+'</title></circle>'})}
 const labels=pts.length===1?[0]:[0,Math.floor((pts.length-1)/2),pts.length-1];[...new Set(labels)].forEach(i=>h+='<text x="'+x(i)+'" y="245" text-anchor="'+(i===0?'start':i===pts.length-1?'end':'middle')+'" fill="#8e9db1" font-size="11">'+esc(time(pts[i].t))+'</text>');
 return '<svg class="chart" viewBox="0 0 720 255" role="img" aria-label="График">'+h+'</svg>'
}
function byDay(ts){const o={};for(const t of ts){if(!num(t.pnl)||!num(t.closed))continue;const k=day(t.closed);o[k]=(o[k]||0)+Number(t.pnl)}return Object.entries(o).sort().map(([k,y])=>({t:Date.parse(k+'T00:00:00Z')/1000,y}))}
function validTrades(ts){return ts.filter(t=>num(t.pnl)&&num(t.closed))}
function sums(ts){let a=validTrades(ts);return {net:a.length?a.reduce((s,t)=>s+Number(t.pnl),0):null,win:a.length?a.filter(t=>t.pnl>0).length/a.length:null,n:a.length}}
function periodPick(){return '<select id="period"><option value="1" '+(period===1?'selected':'')+'>24 часа</option><option value="7" '+(period===7?'selected':'')+'>7 дней</option><option value="30" '+(period===30?'selected':'')+'>30 дней</option></select>'}
function graphBox(title,points,base,bar=false){return '<section><div class="row"><h2>'+esc(title)+'</h2>'+periodPick()+'</div>'+chart(points,bar,base)+'</section>'}
function mix(ts){const groups=[['linear','Фьючерсы'],['spot','Спот']];return groups.map(([k,label])=>{let a=ts.filter(t=>(t.market||'linear')===k),s=sums(a);return '<div><div class="row"><span>'+label+' · '+a.length+'</span><b class="'+cl(s.net)+'">'+sign(s.net)+' USDT</b></div><div class="track"><i style="width:'+Math.min(100,a.length/Math.max(1,ts.length)*100)+'%"></i></div></div>'}).join('')}
function positionTable(ps){return table(['Инструмент','Рынок','Сторона','Вход','P&L, USDT','Статус'],ps.map(p=>[esc(p.symbol)+(p.grid?' <span class="badge">Сетка '+(p.adds||0)+'</span>':''),esc(market(p.market)),esc(side(p.side)),f(p.entry,5),colored(p.pnl??p.last_net),esc(({open:'Открыта',entry_pending:'Вход',add_pending:'Усреднение',exit_pending:'Выход'})[p.phase]||'Открыта')]),'Открытых позиций нет')}
function tradeTable(ts){return table(['Закрытие','Инструмент','Рынок','Сторона','P&L, USDT'],ts.slice().sort((a,b)=>(b.closed||0)-(a.closed||0)).slice(0,60).map(t=>[esc(time(t.closed)),esc(t.symbol)+(t.grid?' <span class="badge">Сетка</span>':''),esc(market(t.market)),esc(side(t.side)),colored(t.pnl)]),'Закрытых сделок нет')}
function overview(p,d,dd,r){
 let pts=(p.equity_history||[]).filter(x=>x.time>=Date.now()/1000-period*86400).map(x=>({t:x.time,y:num(p.start)?x.equity-p.start:null}));
 let db=(dd.history||[]).filter(x=>x.time>=Date.now()/1000-period*86400).map(x=>({t:x.time,y:num(d.initial_equity)?x.equity-d.initial_equity:null}));
 let dp=num(d.equity_usdt)&&num(d.initial_equity)?d.equity_usdt-d.initial_equity:null,pp=num(p.equity)&&num(p.start)?p.equity-p.start:null;
 return tiles([tile('Bybit · изменение equity',sign(dp)+' USDT','Демо, от стартового наблюдения',cl(dp)),tile('Внутренний портфель',usd(p.equity),sign(pp)+' USDT с начала',cl(pp)),tile('Открыто на Bybit',f(d.managed,0),'Фьючерсы + спот'),tile('Внутренние позиции',f(p.positions?.length,0),'Симуляция')])+
 '<div class="split">'+graphBox('Bybit · изменение капитала',db,0)+section('Bybit сейчас',tilesSmall([['Сигналы',d.selection?.signals],['Закрыто стратегиями',d.closed],['Сверено P&L',d.strategy_pnl_matched],['Сетки открыто',d.grid_open]]))+'</div>'+
 '<div class="split">'+graphBox('Внутренний портфель · результат',pts,0)+section('Обучение сейчас',tilesSmall([['Модели в лиге',r.evaluated],['Допущено',r.qualified],['Скальп-модели',r.scalp?.models],['Лидеры изучены',Object.keys(r.leader_profiles||{}).length]]))+'</div>';
}
function tilesSmall(items){return '<div class="bars">'+items.map(([k,v])=>'<div class="row"><span class="muted">'+esc(k)+'</span><strong>'+esc(f(v,0))+'</strong></div>').join('')+'</div>'}
function bybit(d,dd){
 let ts=(dd.trades||[]).filter(t=>!t.probe),today=ts.filter(t=>day(t.closed)===dd.day),s=sums(ts),st=sums(today),diff=num(d.equity_usdt)&&num(d.initial_equity)?d.equity_usdt-d.initial_equity:null;
 let hist=(dd.history||[]).filter(x=>x.time>=Date.now()/1000-period*86400).map(x=>({t:x.time,y:num(d.initial_equity)?x.equity-d.initial_equity:null}));
 return '<div class="callout">Лимит робота: '+esc(usd(d.capital_limit))+' · кошелёк Bybit Demo: '+esc(usd(d.wallet_usdt))+' · equity всего USDT-сегмента: '+esc(usd(d.equity_usdt))+'</div>'+
 tiles([tile('Изменение equity',sign(diff)+' USDT','Весь USDT-сегмент от начала',cl(diff)),tile('Чистый P&L стратегий',sign(s.net)+' USDT','Сверено '+s.n+' из '+ts.length,cl(s.net)),tile('Сегодня · закрыто',sign(st.net)+' USDT',st.n+' сверенных сделок',cl(st.net)),tile('Win rate',num(s.win)?f(s.win*100,1)+'%':'—','Только сверенные сделки')])+
 '<div class="split">'+graphBox('Динамика equity · USDT',hist,0)+section('Исполнение',tilesSmall([['Позиции фьючерсов',d.managed],['Спот открыт',d.spot_open],['Сетки открыты',d.grid_open],['Усреднения открытых',d.grid_adds],['Сигналы фьючерсов',d.selection?.signals],['Сигналы спота',d.spot_selection?.signals]])+'<p class="label">'+(d.halted?'Риск: остановлено':d.status==='connected'?'Биржа подключена':'Подключение не подтверждено')+'</p>')+'</div>'+
 '<div class="split">'+section('Чистый P&L по дням',chart(byDay(ts),true,0))+section('Распределение сделок','<div class="bars">'+mix(ts)+'</div><p class="label">Сетки входят во фьючерсы. Диагностические заявки исключены.</p>')+'</div>'+
 section('Открытые позиции робота',positionTable(dd.positions||[]))+section('Последние сделки Bybit',tradeTable(ts))+'<small>Несверенный P&L обозначен «—». История equity начинается с новой версии панели; старые наблюдения не восстановлены. P&L по дням — только сохранённые сверенные закрытия.</small>'
}
function paper(p){
 let ts=p.trades||[],today=ts.filter(t=>day(t.closed)===p.day),s=sums(today),diff=num(p.equity)&&num(p.start)?p.equity-p.start:null,delta=num(p.equity)&&num(p.day_start)?p.equity-p.day_start:null,ret=num(delta)&&p.day_start>0?delta/p.day_start:null;
 let pts=(p.equity_history||[]).filter(x=>x.time>=Date.now()/1000-period*86400).map(x=>({t:x.time,y:x.equity}));
 return tiles([tile('Капитал',usd(p.equity),'Старт '+usd(p.start)),tile('С начала',sign(diff)+' USDT',num(diff)&&p.start?pc(diff/p.start):'—',cl(diff)),tile('Сегодня',sign(delta)+' USDT',pc(ret),cl(delta)),tile('Закрыто сегодня',f(today.length,0),num(s.win)?f(s.win*100,1)+'% прибыльных':'—')])+
 '<div class="split">'+graphBox('Капитал внутреннего портфеля',pts,p.start??null)+section('Дневная цель', '<h2 class="'+cl(ret)+'">'+pc(ret)+'</h2><div class="progress"><i style="width:'+Math.max(0,Math.min(100,(ret||0)/(p.target_daily||.1)*100))+'%"></i></div><p class="label">Цель '+pc(p.target_daily)+'</p>'+tilesSmall([['Открытые позиции',p.positions?.length],['Закрыто в истории',ts.length]])+'<p class="label">'+(p.halted?'Остановлено контролем риска':'Внутренний симулятор')+'</p>')+'</div>'+
 '<div class="split">'+section('P&L по дням · симуляция',chart(byDay(ts),true,0))+section('Распределение сделок','<div class="bars">'+mix(ts)+'</div>')+'</div>'+section('Открытые позиции',positionTable(p.positions||[]))+section('Последние виртуальные сделки',tradeTable(ts))
}
function smcPanel(v){const reports=Object.entries(v.reports||{}),progress=Object.entries(v.progress||{});const n=reports.reduce((s,[k,r])=>s+(r.tested||0),0);return section('YouTube · FVG + CHoCH + Fibonacci',tiles([tile('Рынки',reports.length+' / '+(v.symbols?.length||10),'История 45 дней'),tile('Гипотезы',f(n,0),'Отдельные тесты'),tile('Прошли отбор',f(v.approved,0),'Только историческая проверка'),tile('Статус',({starting:'Запуск',collecting:'Сбор истории',testing:'Тестирование',complete:'Завершено',error:'Ошибка'})[v.status]||'—','Без биржевых ордеров')])+table(['Монета','Собрано минут','Тестов','Сделок holdout','Средний R holdout','Допуск'],progress.map(([k,p])=>{let r=v.reports?.[k],m=r?.results?.find(x=>x.approved)||r?.results?.[0];return [esc(k),f(p.rows,0),f(r?.tested,0),f(m?.test?.trades,0),f(m?.test?.mean_r,3),esc(r?(r.results?.some(x=>x.approved)?'История пройдена':'Не пройдена'):'Сбор')]}),'Сбор ещё не начался')+'<small>Цели 3–4R, Нью-Йорк 09:30–11:30 и весь день. Издержки моделируются; допуск не равен готовности к биржевому исполнению.</small>')}
function yearPanel(v){let done=v.status==='complete';let rs=(v.results||[]).filter(x=>x.long_only&&x.max_notional_multiple===10);return section('BTC · годовой тест стратегии из видео',tiles([tile('Сессии',f(v.processed,0)+' / '+f(v.sessions,0),'25.11.2025 – 25.11.2026'),tile('Полные сессии',f(v.complete_sessions,0),'Минутные свечи Bybit'),tile('Депозит','1 000 USDT','Старт каждой модели'),tile('Статус',({starting:'Запуск',collecting:'Сбор и тест',complete:'Готово',incomplete:'Неполные данные',error:'Ошибка'})[v.status]||'—',done?'Полный год':'Не итог года')])+table(['Цель','Риск','Сделки','Win rate','Капитал, USDT','Net, USDT','Просадка'],rs.map(x=>[esc(x.rr+'R'),pc(x.risk),f(x.trades,0),num(x.win_rate)?f(x.win_rate*100,1)+'%':'—',f(x.equity),colored(x.pnl),pc(x.drawdown)]),'Нет результатов')+'<small>Только LONG, Нью-Йорк, 10× предел номинала, моделируемые расходы. Не реальная торговля; до завершения это промежуточная выборка.</small>')}
function learning(r){const evol=Object.entries(r.evolution||{}),profile=Object.entries(r.leader_profiles||{});let tests=evol.reduce((a,[k,v])=>a+(v.tested_total||0),0);
 let groups=[['Фьючерсы',r.futures?.active,r.futures?.closed,r.futures?.positive_models],['Спот',r.spot?.active,r.spot?.closed,r.spot?.positive_models],['Скальпинг',r.scalp?.models,r.scalp?.closed,r.scalp?.depth_evidence?.positive_models],['Маржинальный спот',r.margin?.models,r.margin?.closed,r.margin?.positive]];
 return tiles([tile('Модели в лиге',f(r.evaluated,0),'Активный отбор'),tile('Допущено',f(r.qualified,0),'Внутренний портфель'),tile('Гипотезы лидеров',f(tests,0),'Эволюционный поиск'),tile('Исходы ML',f((r.fast?.labels||0)+(r.slow?.labels||0),0),'60 сек + 15 мин')])+
 yearPanel(r.video_smc_year||{})+smcPanel(r.video_smc||{})+section('Лаборатории · отдельные симуляции',table(['Направление','Модели','Закрыто','Положительные модели'],groups.map(g=>[esc(g[0]),f(g[1],0),f(g[2],0),f(g[3],0)])))+
 section('Лидеры копитрейдинга',table(['Трейдер','Сделки','Net P&L, USDT','Win rate'],profile.map(([k,v])=>[esc(k),f(v.rows,0),colored(v.net_pnl),num(v.win_share)?f(v.win_share*100,1)+'%':'—'])))+
 section('Эволюция стратегий лидеров',table(['Монета','Поколение','Тестов','Сделок/сутки*','Net/сутки*','Текущий вход'],evol.map(([k,v])=>{let b=v.archive?.[0]?.validation||{},d=r.entry_diagnostics?.[k]||{};return [esc(k),f(v.generation,0),f(v.tested_total,0),f(b.trades_per_day,2),'<span class="'+cl(b.daily_mean)+'">'+pc(b.daily_mean)+'</span>',esc(({signal:'Сигнал',no_learned_entry:'Нет сигнала',history_gap:'Нет истории',bar_expired:'Устарело',no_fresh_book:'Нет стакана'})[d.status]||'—')]}))+'<small>* Историческая валидация лучшего кандидата, не прибыль на Bybit.</small>')+

function render(){if(!state)return;let {paper:p={},demo:d={},demo_detail:dd={},research:r={}}=state;let page=({overview:()=>overview(p,d,dd,r),bybit:()=>bybit(d,dd),paper:()=>paper(p),learning:()=>learning(r)})[tab];if(!page){tab='overview';page=()=>overview(p,d,dd,r)}$('view').innerHTML=page();document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelectorAll('select#period').forEach(e=>e.onchange=()=>{period=Number(e.value);render()});let age=state.server_time-(d.time||0),fresh=age<90&&d.status==='connected';$('dot').className='dot '+(fresh?'':d.status==='error'?'bad':'wait');$('status').textContent=fresh?'Bybit подключён':d.status==='error'?'Ошибка Bybit':'Ожидание данных Bybit';$('stamp').textContent='Обновлено '+time(state.server_time)+' · '+(state.state?.version||'');}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;location.hash=tab;render()});window.addEventListener('hashchange',()=>{tab=location.hash.slice(1)||'overview';render()});
let busy=false;async function refresh(){if(busy)return;busy=true;let c=new AbortController(),timer=setTimeout(()=>c.abort(),12000);try{const r=await fetch('/api/cabinet',{cache:'no-store',signal:c.signal});if(!r.ok)throw Error('HTTP '+r.status);state=await r.json();render();$('alert').classList.add('hide')}catch(e){$('alert').textContent='Нет свежего ответа сервера. Последние данные сохранены на экране.';$('alert').classList.remove('hide');$('dot').className='dot bad'}finally{clearTimeout(timer);busy=false}}refresh();setInterval(refresh,15000);
</script></body></html>
