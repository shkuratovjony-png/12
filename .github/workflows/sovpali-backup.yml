name: Sovpali encrypted database backup

on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sovpali-backup.yml'

permissions:
  contents: write
  id-token: write

env:
  BACKUP_URL: https://one2-1o22.onrender.com/internal/github-backup

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sovpali-backup")"
          TOKEN="$(printf '%s' "$RESPONSE" | jq -r '.value')"
          test -n "$TOKEN"
          test "$TOKEN" != "null"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Download encrypted database backup
        id: download
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          FILE="sovpali-backup-$(date -u +%Y%m%d-%H%M%SZ).json.gz.fernet"
          curl --fail --show-error --silent --location \
            --retry 12 --retry-all-errors --retry-delay 10 \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            "$BACKUP_URL" \
            -o "$FILE"
          test -s "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "size=$(wc -c < "$FILE")" >> "$GITHUB_OUTPUT"

      - name: Store daily backup for 35 days
        uses: actions/upload-artifact@v4
        with:
          name: sovpali-db-${{ github.run_id }}
          path: ${{ steps.download.outputs.file }}
          retention-days: 35
          compression-level: 0
          if-no-files-found: error

      - name: Store monthly backup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.download.outputs.file }}
        run: |
          set -euo pipefail
          if [ "$(date -u +%d)" != "01" ]; then
            echo "Not the first day of the month; monthly copy not needed."
            exit 0
          fi
          TAG="sovpali-backup-$(date -u +%Y-%m)"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Sovpali encrypted backup $(date -u +%Y-%m)" \
              --notes "Encrypted PostgreSQL backup. Recovery key is stored separately and is not committed to GitHub."
          fi

          mapfile -t OLD_TAGS < <(
            gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
              --json tagName,createdAt \
              --jq '[.[] | select(.tagName | startswith("sovpali-backup-"))] | sort_by(.createdAt) | reverse | .[12:] | .[].tagName'
          )
          for OLD_TAG in "${OLD_TAGS[@]}"; do
            gh release delete "$OLD_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done

      - name: Backup summary
        shell: bash
        run: |
          echo "Encrypted backup created successfully."
          echo "File: ${{ steps.download.outputs.file }}"
          echo "Bytes: ${{ steps.download.outputs.size }}"
