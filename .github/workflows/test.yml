name: Poekhali checkout security tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r checkout/requirements.txt
      - name: Test payment gate and protected course route
        run: cd checkout && python -m unittest -v test_security
