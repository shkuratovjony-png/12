name: Sovpali materialize test
on:
  push:
    branches: [sovpali-hq-files]
permissions:
  contents: write
jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sovpali-hq-files
      - name: Test write
        run: |
          echo ok > sovpali/.workflow_test_ok
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sovpali/.workflow_test_ok
          git commit -m "Workflow write test"
          git push origin HEAD:sovpali-hq-files
