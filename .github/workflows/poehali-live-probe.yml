name: Inspect Poekhali live checkout
on:
  push:
    branches: [poehali-checkout-20261104]
    paths: [.github/workflows/poehali-live-probe.yml]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check live payment readiness without secrets
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, json
          for u in ['https://poehali-checkout.onrender.com/health','https://poehali-checkout.onrender.com/checkout']:
              try:
                  req=urllib.request.Request(u,headers={'User-Agent':'Poekhali-Checkout-Monitor/1.0'})
                  with urllib.request.urlopen(req,timeout=45) as r:
                      body=r.read(20000).decode('utf-8','replace')
                      print('URL:',u,'HTTP:',r.status,flush=True)
                      if u.endswith('/health'):
                          print('HEALTH:',body[:3000],flush=True)
                      else:
                          print('PAGE_ACCEPTS_PAYMENT:', 'name="method"' in body and 'Оплатить 900' in body, flush=True)
                          print('PAGE_NOT_READY:', 'Приём оплаты пока на настройке' in body, flush=True)
              except Exception as e:
                  print('PROBE_ERROR:',type(e).__name__,str(e)[:300],flush=True)
          PY
